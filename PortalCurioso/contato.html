<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Portal Curioso</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Portal Curioso</h1>
        <p>Entre em contato conosco!</p>

        <nav aria-label="Navegação principal">
            <a href="index.html">Início</a>
            <a href="postagens.html">Postagens</a>
            <a href="contato.html">Contato</a>
        </nav>
    </header>

    <main>

        <section>
            <h2>Fale Conosco</h2>

            <p>
                Tem uma sugestão, dúvida ou curiosidade para compartilhar?
                Envie uma mensagem para o Portal Curioso.
            </p>
        </section>

        <section>
            <h2>Formulário de Contato</h2>

           <form>

    <label for="nome">Nome:</label>
    <input type="text" id="nome" name="nome" required>

    <label for="email">E-mail:</label>
    <input type="email" id="email" name="email" required>

    <label for="assunto">Assunto:</label>
    <input type="text" id="assunto" name="assunto" required>

    <label for="mensagem">Mensagem:</label>
    <textarea id="mensagem" name="mensagem" rows="5" required></textarea>

    <button type="submit">Enviar mensagem</button>

        </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Portal Curioso - Todos os direitos reservados.</p>
    </footer>

</body>

</html>
