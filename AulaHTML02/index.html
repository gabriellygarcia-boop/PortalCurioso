<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Minha primeira página</title>

    <style>
        h1 {
            color: purple;
            font-size: 40px;
            text-align: center;
        }

        p {
            color: purple;
        }

        img {
            display: block;
            margin: auto;
        }
    </style>
</head>

<body>

    <h1>Minha primeira página HTML</h1>

    <p>Olá! Esta é a minha primeira página criada com HTML.</p>

    <p>Estou aprendendo a criar páginas web.</p>

    <img src="imagens/mydemon.webp" 
    alt="Imagem do My Demon" 
    title="My Demon" width="200" height="200" style="border: 5px solid black;">

    <marquee direction="right" scrollamount="10">Bem-vindo à minha página!</marquee>

    <video controls width="400" height="300" autoplay muted>
        <source src="videos/meuvdo.mp4" type="video/mp4">
    </video>

    <a href="https://www.google.com">Clique aqui para acessar o Google</a>

</body>

</html>
